apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: ghcr.io/deep-astaad/job-hunt:sha-91b2db0
          args: ["celery", "-A", "celery_app", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
          env:
            - name: APP_MODE
              value: celery-beat
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: DJANGO_API_URL
              value: http://django:80
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: jobhunt_db
            - name: MYSQL_USER
              value: jobhunt_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: APIFY_API_TOKEN
                  optional: true
            # The rotation pool config.get_openai_api_keys() picks from. The
            # single OPENAI_API_KEY above stays as the legacy fallback.
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: OPENAI_API_KEYS
                  optional: true
            # Not secrets, so they live here rather than in the Secret - and they
            # MUST be set. These settings previously existed only in Redis, so
            # when Redis was OOMKilled on 2026-09-02 and came back empty, both
            # silently fell back to config.py's defaults (api.openai.com /
            # gpt-4o-mini) and every format/rank task failed 401 sending an
            # OpenRouter key to OpenAI.
            - name: OPENAI_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: OPENAI_MODEL
              value: "nvidia/nemotron-3-ultra-550b-a55b:free"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
