apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-flower
spec:
  replicas: 1
  # Recreate, not the RollingUpdate default: the job-hunt-quota ResourceQuota
  # has no headroom for a surge pod (limits.memory already sits at 4Gi of the
  # 5Gi hard cap), so a rolling update's extra pod is rejected with "exceeded
  # quota" and the rollout stalls until the old pod is scaled down anyway.
  # flower is a monitoring UI, not a queue-critical path - a brief gap while
  # the pod restarts is harmless here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-flower
  template:
    metadata:
      labels:
        app: celery-flower
    spec:
      containers:
        - name: celery-flower
          image: ghcr.io/deep-astaad/job-hunt:sha-91b2db0
          args: ["celery", "-A", "celery_app", "flower", "--port=5555"]
          ports:
            - containerPort: 5555
          env:
            - name: APP_MODE
              value: celery-flower
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: DJANGO_API_URL
              value: http://django:80
            # config.py runs its "missing critical environment variables" check
            # for every APP_MODE except celery-worker, so flower needs these to
            # import celery_app at all. It had none of them and was surviving
            # purely on the values in Redis; when Redis was OOMKilled on
            # 2026-09-02 and came back empty, flower went into an unrecoverable
            # CrashLoopBackOff (186 restarts) while the other three carried on
            # from their env fallbacks.
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: OPENAI_API_KEYS
                  optional: true
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: APIFY_API_TOKEN
                  optional: true
            - name: OPENAI_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: OPENAI_MODEL
              value: "nvidia/nemotron-3-ultra-550b-a55b:free"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: celery-flower
spec:
  selector:
    app: celery-flower
  ports:
    - port: 5555
      targetPort: 5555
