apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/deep-astaad/job-hunt:sha-2f3750a
          args: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4"]
          env:
            - name: APP_MODE
              value: celery-worker
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: DJANGO_API_URL
              value: http://django:80
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: jobhunt_db
            - name: MYSQL_USER
              value: jobhunt_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: APIFY_API_TOKEN
                  optional: true
            - name: DISCORD_WEBHOOK_URL_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: DISCORD_WEBHOOK_URL_DEFAULT
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
