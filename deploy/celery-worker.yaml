apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  # Recreate, not the RollingUpdate default: the job-hunt-quota ResourceQuota
  # has no headroom for a surge pod (limits.memory already sits at 4Gi of the
  # 5Gi hard cap), so a rolling update's extra pod is rejected with "exceeded
  # quota" and the rollout stalls until the old pod is scaled down anyway -
  # and any in-flight task on that killed worker is lost. A queue consumer
  # gains nothing from a surge pod; a brief gap while the pod restarts is
  # harmless here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/deep-astaad/job-hunt:sha-b3e665f
          args: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4"]
          env:
            - name: APP_MODE
              value: celery-worker
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: DJANGO_API_URL
              value: http://django:80
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: jobhunt_db
            - name: MYSQL_USER
              value: jobhunt_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: APIFY_API_TOKEN
                  optional: true
            # The rotation pool config.get_openai_api_keys() picks from. The
            # single OPENAI_API_KEY above stays as the legacy fallback.
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: OPENAI_API_KEYS
                  optional: true
            # Not secrets, so they live here rather than in the Secret - and they
            # MUST be set. These settings previously existed only in Redis, so
            # when Redis was OOMKilled on 2026-09-02 and came back empty, both
            # silently fell back to config.py's defaults (api.openai.com /
            # gpt-4o-mini) and every format/rank task failed 401 sending an
            # OpenRouter key to OpenAI.
            - name: OPENAI_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: OPENAI_MODEL
              value: "nvidia/nemotron-3-ultra-550b-a55b:free"
            - name: DISCORD_WEBHOOK_URL_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: DISCORD_WEBHOOK_URL_DEFAULT
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
