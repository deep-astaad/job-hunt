apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn, not the local-path default: local-path lands on the node's ~38GB
  # OS disk with no snapshots and no expansion. Longhorn uses the dedicated
  # /var/lib/longhorn data disk and supports both.
  storageClassName: longhorn
  resources:
    requests:
      # Raised 8Gi -> 58Gi on 2026-09-08 after this volume filled to 100% and
      # took the whole app down (INC-2026-009). The database itself is only
      # ~1.4GB; what filled the disk was 30 days of binary logs at ~1GB/day.
      # The binlog retention below is the actual fix — this is headroom so a
      # full volume can never again hang every InnoDB commit. Requires the
      # namespace ResourceQuota at requests.storage: 64Gi (homelab-k8s #90).
      storage: 58Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          # Keep only 3 days of binary logs instead of MySQL's 30-day default.
          # At ~1GB/day of Celery write traffic the default retention implies a
          # ~30GB binlog footprint, which is what filled the 8Gi volume and
          # caused INC-2026-009: with zero bytes free, an InnoDB commit does not
          # fail, it hangs forever holding its connection — 151 of those
          # exhausted max_connections and crash-looped Django on error 1040.
          # 3 days is retention we can actually afford; nothing consumes these
          # logs today (single instance, no replica, no PITR procedure), so this
          # discards nothing in use. Passed as args so the image entrypoint still
          # runs its normal initialisation.
          args:
            - --binlog-expire-logs-seconds=259200
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: jobhunt_db
            - name: MYSQL_USER
              value: jobhunt_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 200m
              # 512Mi requested (not 128Mi): with a 128Mi request this pod was
              # Burstable and first in line for eviction under node pressure.
              memory: 512Mi
            limits:
              # 1 CPU / 1.5Gi: a 655MB import OOMKilled repeatedly at 512Mi, and
              # 300m CPU made it crawl. Both sit under the LimitRange per-container
              # max (cpu 1, memory 2Gi) and inside the namespace ResourceQuota.
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
