apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn, not the local-path default: local-path lands on the node's ~38GB
  # OS disk with no snapshots and no expansion. Longhorn uses the dedicated
  # /var/lib/longhorn data disk and supports both.
  storageClassName: longhorn
  resources:
    requests:
      # 8Gi holds the ~1.2GB restored dataset with room to grow, and stays
      # inside the job-hunt namespace ResourceQuota (requests.storage: 10Gi).
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: jobhunt_db
            - name: MYSQL_USER
              value: jobhunt_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 200m
              # 512Mi requested (not 128Mi): with a 128Mi request this pod was
              # Burstable and first in line for eviction under node pressure.
              memory: 512Mi
            limits:
              # 1 CPU / 1.5Gi: a 655MB import OOMKilled repeatedly at 512Mi, and
              # 300m CPU made it crawl. Both sit under the LimitRange per-container
              # max (cpu 1, memory 2Gi) and inside the namespace ResourceQuota.
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
