apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: ghcr.io/deep-astaad/job-hunt:sha-eac1492
          ports:
            - containerPort: 8000
          env:
            - name: APP_MODE
              value: web
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: DJANGO_SECRET_KEY
            - name: DJANGO_ALLOWED_HOSTS
              # `django` and `frontend` are required, not optional: the Next.js BFF
              # proxies server-side to BACKEND_INTERNAL_URL (http://django:80), so
              # those requests arrive with Host: django. Without it Django rejects
              # every proxied call as DisallowedHost -> HTTP 400 before it ever
              # checks credentials, which breaks /api/auth/login/ and /api/auth/me/
              # while /admin (Host: job-hunt.neovara.uk) keeps working. The old
              # compose config had these; the k8s port dropped them.
              value: "job-hunt.neovara.uk,django,frontend,localhost,127.0.0.1"
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: "https://job-hunt.neovara.uk"
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: jobhunt_db
            - name: MYSQL_USER
              value: jobhunt_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: MYSQL_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: APIFY_API_TOKEN
                  optional: true
            - name: DISCORD_WEBHOOK_URL_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: job-hunt-secrets
                  key: DISCORD_WEBHOOK_URL_DEFAULT
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/jobs/stats/
              port: 8000
              httpHeaders:
                - name: Host
                  value: job-hunt.neovara.uk
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/jobs/stats/
              port: 8000
              httpHeaders:
                - name: Host
                  value: job-hunt.neovara.uk
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: django
spec:
  selector:
    app: django
  ports:
    - port: 80
      targetPort: 8000
