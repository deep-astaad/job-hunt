name: Build Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-

    - name: Build and push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Update deploy manifests with image SHA
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        IMAGE_TAG="ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}"
        echo "Pinning deploy image to: ${IMAGE_TAG}"
        # Match any existing sha-<hex> tag, not a literal PLACEHOLDER -
        # that string only ever existed in the manifests' first commit, so
        # this step silently no-op'd on every push since (deploy manifests
        # stayed pinned to the very first built image).
        sed -i -E "s|ghcr.io/${{ github.repository }}:sha-[0-9a-f]+|${IMAGE_TAG}|g" deploy/*.yaml

    - name: Commit and push updated manifests
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add deploy/
        if git diff --cached --quiet; then
          echo "No manifest changes to commit"
        else
          git commit -m "deploy: update image tag to sha-${GITHUB_SHA::7} [skip ci]"
          git push
        fi
