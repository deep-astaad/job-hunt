name: Build Frontend Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-frontend
        tags: |
          type=sha,prefix=sha-

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Update deploy manifest with image SHA
      if: github.ref == 'refs/heads/main'
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        IMAGE_TAG="ghcr.io/${{ github.repository }}-frontend:sha-${SHORT_SHA}"
        echo "Pinning deploy image to: ${IMAGE_TAG}"
        # Match any existing sha-<hex> tag - see docker-build.yml for why
        # a literal PLACEHOLDER match only ever fires once.
        sed -i -E "s|ghcr.io/${{ github.repository }}-frontend:sha-[0-9a-f]+|${IMAGE_TAG}|g" deploy/frontend.yaml

    - name: Commit and push updated manifest
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add deploy/frontend.yaml
        if git diff --cached --quiet; then
          echo "No manifest changes to commit"
        else
          git commit -m "deploy: update frontend image tag to sha-${GITHUB_SHA::7} [skip ci]"
          git push
        fi
